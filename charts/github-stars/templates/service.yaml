---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-stars.fullname" . }}
  labels:
    {{- include "github-stars.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "github-stars.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 8080
      targetPort: 8080
