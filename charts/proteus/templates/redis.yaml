---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proteus-redis
  labels:
    {{- include "proteus.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteus
        app.kubernetes.io/component: redis
    spec:
      {{- with .Values.servers.redis.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: redis-data
          {{- if eq .Values.storage.redisData.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            {{- toYaml .Values.storage.redisData.persistentVolumeClaim | nindent 12 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
      - name: redis
        image: {{ .Values.redis.repository }}:{{ .Values.redis.tag }}
        imagePullPolicy: Always
        args:
        - "--appendonly"
        - "yes"
        - "--appendfsync"
        - "everysec"
        - --requirepass $(REDIS_PASSWORD)
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ default .Values.secretRefs.secret .Values.secretRefs.keys.REDIS_PASSWORD.secret }}
                key: {{ .Values.secretRefs.keys.REDIS_PASSWORD.key }}
          {{ toYaml .Values.commonEnv | nindent 10 }}
        ports:
          - containerPort: 6379
        {{- with .Values.servers.redis.redis.livenessProbe }}
        livenessProbe:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.servers.redis.redis.resources }}
        resources:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: redis-data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: proteus-redis
spec:
  ports:
  - name: tcp-redis
    port: 6379
    targetPort: 6379
  selector:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proteus-redis-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteus
        app.kubernetes.io/component: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      {{- with .Values.servers.redis.exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: exporter
        image: bitnami/redis-exporter:latest
        imagePullPolicy: Always
        args:
        - '-redis.password=$(REDIS_PASSWORD)'
        - '-redis.addr=redis://proteus-redis:6379'
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ default .Values.secretRefs.secret .Values.secretRefs.keys.REDIS_PASSWORD.secret }}
                key: {{ .Values.secretRefs.keys.REDIS_PASSWORD.key }}
          {{ toYaml .Values.commonEnv | nindent 10 }}
        ports:
          - name: metrics
            containerPort: 9121
        {{- with .Values.servers.redis.exporter.livenessProbe }}
        livenessProbe:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.servers.redis.exporter.resources }}
        resources:
          {{ toYaml . | nindent 10 }}
        {{- end }}
