{{- if .Values.config.apps.solar.web.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: proteus-solar-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: solar-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteus
        app.kubernetes.io/component: solar-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ include "ports.prometheus" . }}"
    spec:
      {{- with .Values.servers.solar.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: proteus-config
      containers:
      - name: solar-web
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        args:
        - apps
        - solar
        - web
        env:
          {{ include "proteus.credentialsEnv" . | nindent 10 }}
          {{ toYaml .Values.commonEnv | nindent 10 }}
        ports:
          - name: http
            containerPort: {{ include "ports.solar.web" . }}
          - name: metrics
            containerPort: {{ include "ports.prometheus" . }}
          - name: healthz
            containerPort: {{ include "ports.healthz" . }}
        {{- with .Values.servers.solar.web.livenessProbe }}
        livenessProbe:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.servers.solar.web.resources }}
        resources:
          {{ toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/proteus
---
apiVersion: v1
kind: Service
metadata:
  name: proteus-solar-web
spec:
  ports:
  - name: http
    port: {{ include "ports.solar.web" . }}
    targetPort: {{ include "ports.solar.web" . }}
  selector:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: solar-web
---
{{- if .Values.ingress.solar.web.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proteus-solar-web
spec:
  hostnames: {{ toYaml .Values.ingress.solar.web.hostnames | nindent 4 }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.ingress.solar.web.gateway.name }}
    namespace: {{ .Values.ingress.solar.web.gateway.namespace }}
    {{- if .Values.ingress.solar.web.gateway.section }}
    sectionName: {{ .Values.ingress.solar.web.gateway.section }}
    {{- end }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: proteus-solar-web
      port: {{ include "ports.solar.web" . }}
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
{{- end }}
{{- end }}