{{- if .Values.config.apps.solar.store.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: proteus-solar-store
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: proteus
      app.kubernetes.io/component: solar-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proteus
        app.kubernetes.io/component: solar-store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ include "ports.prometheus" . }}"
    spec:
      {{- with .Values.servers.solar.store.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: proteus-config
      containers:
      - name: solar-store
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        args:
        - apps
        - solar
        - store
        env:
          {{ include "proteus.credentialsEnv" . | nindent 10 }}
          {{ toYaml .Values.commonEnv | nindent 10 }}
        ports:
          - name: metrics
            containerPort: {{ include "ports.prometheus" . }}
          - name: healthz
            containerPort: {{ include "ports.healthz" . }}
        {{- with .Values.servers.solar.store.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.servers.solar.store.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/proteus
{{- end }}