# Default values for proteus.
# This is a YAML-formatted file.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

image:
  repository: codeberg.org/clambin/proteus
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

redis:
  repository: redis
  tag: 8.10.2

dashboards:
  install: true

storage:
  redisData:
    type: emptyDir
    persistentVolumeClaim: { }

secretRefs:
  secret: proteus-credentials
  keys:
    REDIS_PASSWORD:
      key: REDIS_PASSWORD
      #secret: proteus-credentials
    SOLAREDGE_KEY:
      key: SOLAREDGE_KEY
      #secret: proteus-credentials
    SOLAR_STORE_DB:
      key: SOLAR_STORE_DB
      #secret: proteus-credentials
    SOLAR_WEB_DB:
      key: SOLAR_WEB_DB
      #secret: proteus-credentials
    CLIMATE_BOT_SLACK_TOKEN:
      key: CLIMATE_BOT_SLACK_TOKEN
      #secret: proteus-credentials
    CLIMATE_BOT_SLACK_APP_TOKEN:
      key: CLIMATE_BOT_SLACK_APP_TOKEN
      #secret: proteus-credentials
    CLIMATE_CONTROLLER_SLACK_TOKEN:
      key: CLIMATE_CONTROLLER_SLACK_TOKEN
      #secret: proteus-credentials

commonEnv: []

servers:
  redis:
    redis:
      nodeSelector: {}
      livenessProbe: { }
      #  httpGet:
      #    path: /healthz
      #    port: 8888
      resources: {}
      #  requests:
      #    cpu: 10m
      #    memory: 30Mi
    exporter:
      nodeSelector: {}
      livenessProbe: { }
      resources: {}
  collectors:
    nodeSelector: {}
    livenessProbe: {}
    resources: {}
  climate:
    bot:
      nodeSelector: {}
      livenessProbe: {}
      resources: {}
    controller:
      nodeSelector: {}
      livenessProbe: {}
      resources: {}
  solar:
    store:
      nodeSelector: {}
      livenessProbe: {}
      resources: {}
    web:
      nodeSelector: {}
      livenessProbe: {}
      resources: {}
  watchdog:
    nodeSelector: {}
    livenessProbe: {}
    resources: {}

ingress:
  solar:
    web:
      enabled: false
      hostnames: []
      gateway:
        name: traefik-gateway
        namespace: traefik
        section: web


config:
  log:
    level: info
    format: json
  prometheus:
    addr: :9090
    path: /metrics
  health:
    addr: :8888
    path: /healthz
  redis:
    addr: proteus-redis:6379
    password: ${REDIS_PASSWORD}
  devices:
    homewizard:
      addr: ""
    sigenergy:
      addr: ""
    solarEdge:
      key: ${SOLAREDGE_KEY}
  collectors:
    grid:
      enabled: true
      type: homewizard
      interval: 30s
    battery:
      enabled: true
      type: sigenergy
      interval: 30s
    climate:
      enabled: true
      type: tado
      interval: 5m
    solar:
      enabled: true
      type: solaredge
      interval: 1m
  apps:
    solar:
      store:
        enabled: true
        db: ${SOLAR_STORE_DB}
      web:
        enabled: true
        addr: :8080
        db: ${SOLAR_WEB_DB}
    climate:
      bot:
        enabled: true
        slack:
          token: ${CLIMATE_BOT_SLACK_TOKEN}
          appToken: ${CLIMATE_BOT_SLACK_APP_TOKEN}
      controller:
        enabled: true
        slackToken: ${CLIMATE_CONTROLLER_SLACK_TOKEN}
        rules:
          home: []
          zones: {}
  watchdog:
    enabled: true
    alertmanager: http://prometheus-alertmanager.monitoring.svc:9093
    threshold: 5